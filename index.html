<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reto Debug - Ciclo For</title>

    <link rel="stylesheet" href="estilos.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="contenedor">

        <h1>Reto: Debug del ciclo for</h1>

        <p>
            Ejercicio 4: Mostrar los números impares
            desde el 1 hasta el 7.
        </p>

        <button onclick="ejecutar(4)">
            Ejecutar ejercicio 4
        </button>

        <div class="informacion">
            <h2>Resultado esperado en consola</h2>

            <p>1</p>
            <p>3</p>
            <p>5</p>
            <p>7</p>
        </div>

        <div class="instrucciones">

            <h2>Cómo revisar el resultado</h2>

            <p>
                Presiona F12 en el navegador.
            </p>

            <p>
                Después entra en la pestaña
                Console / Consola.
            </p>

            <p>
                Para realizar el Debug entra en
                Sources / Fuentes.
            </p>

        </div>

    </div>

</body>
</html>
