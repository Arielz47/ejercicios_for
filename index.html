<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ejercicios ciclo FOR</title>

    <link rel="stylesheet" href="estilos.css">

    <script src="script.js" defer></script>
</head>

<body>

    <div class="contenedor">

        <h1>Ejercicios con ciclo FOR</h1>

        <div class="ejercicio">

            <h2>Ejercicio 4</h2>

            <p>
                Mostrar los números impares desde el
                <strong>1 hasta el 7</strong>.
            </p>

            <p>
                Presiona el botón para ejecutar el ejercicio.
            </p>

            <button onclick="ejecutar(4)">
                Ejecutar ejercicio
            </button>

        </div>

        <div class="resultado">

            <h3>Resultado</h3>

            <p id="resultado">
                Presiona el botón para obtener el resultado.
            </p>

        </div>

        <div class="mensaje">

            <p>
                También puedes presionar <strong>F12</strong>
                y revisar el resultado en la consola.
            </p>

        </div>

    </div>

</body>

</html>
